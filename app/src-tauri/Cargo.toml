[package]
name = "lupa-app"
version = "0.1.0"
description = "Lupa: guided code review"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "lupa_app_lib"
path = "src/lib.rs"

[[bin]]
name = "lupa"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12", features = [] }

[dev-dependencies]
serde_json = "1"
ts-rs = "12"
