name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: UI tests
        run: npm test

      - name: rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: IPC types up to date
        run: npm run check:ipc

      - name: Claude Code hook tests
        run: node --test .claude/hooks/hooks.test.mjs

      - name: Build installer
        run: npm run app:build

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: lupa-installer-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
