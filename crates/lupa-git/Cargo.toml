[package]
name = "lupa-git"
version = "0.1.0"
description = "Read-only access to Git repositories for Lupa"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gix = { version = "0.89", default-features = false, features = ["revision", "blob-diff", "sha1"] }
thiserror = "2"

[dev-dependencies]
lupa-testkit = { path = "../lupa-testkit" }
